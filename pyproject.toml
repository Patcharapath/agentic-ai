[project]
name = "agentic-ai-labs"
version = "0.1.0"
description = "Coding labs for the Agentic AI course (LangChain + LangGraph)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-openrouter>=0.2.9,<1",
    "langchain-groq>=1.1,<2",
    "langchain-google-genai>=4.4,<5",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentlab"]
